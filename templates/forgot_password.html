<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - DietMitra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <style>.auth-wrapper { opacity: 1; animation: none; }</style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-brand-panel">
            <div class="emoji">🔑</div>
            <h1>DietMitra</h1>
            <p>No worries — we'll email you a link to reset your password.</p>
        </div>
        <div class="auth-form-panel">
            <div class="auth-form-box tilt-card" id="tiltCard">
                <h2>Forgot Password</h2>
                <p class="auth-subtitle">Enter your email and we'll send a reset link</p>

                {% if error %}
                <div class="auth-error">{{ error }}</div>
                {% endif %}
                {% if success %}
                <div class="auth-success">{{ success }}</div>
                {% endif %}

                <form action="/forgot-password" method="POST">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="you@example.com">

                    <button type="submit" class="auth-submit-btn">Send Reset Link</button>
                </form>

                <div class="auth-links">
                    Remembered your password? <a href="/login">Log in</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tiltCard = document.getElementById('tiltCard');
        tiltCard.addEventListener('mousemove', (e) => {
            const rect = tiltCard.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = ((y / rect.height) - 0.5) * -8;
            const rotateY = ((x / rect.width) - 0.5) * 8;
            tiltCard.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        tiltCard.addEventListener('mouseleave', () => {
            tiltCard.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
        });
    </script>
</body>
</html>
