<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - DietMitra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <style>.auth-wrapper { opacity: 1; animation: none; }</style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-brand-panel">
            <div class="emoji">🔒</div>
            <h1>DietMitra</h1>
            <p>Choose a new password to secure your account.</p>
        </div>
        <div class="auth-form-panel">
            <div class="auth-form-box tilt-card" id="tiltCard">
                {% if invalid %}
                    <h2>Link Expired</h2>
                    <p class="auth-subtitle">This reset link is invalid or has expired.</p>
                    <div class="auth-links">
                        <a href="/forgot-password">Request a new link</a>
                    </div>
                {% else %}
                    <h2>Set New Password</h2>
                    <p class="auth-subtitle">Enter your new password below</p>

                    {% if error %}
                    <div class="auth-error">{{ error }}</div>
                    {% endif %}

                    <form action="/reset-password/{{ token }}" method="POST">
                        <label>New Password</label>
                        <input type="password" name="password" required placeholder="At least 6 characters">

                        <label>Confirm New Password</label>
                        <input type="password" name="confirm_password" required placeholder="Re-enter password">

                        <button type="submit" class="auth-submit-btn">Reset Password</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
        const tiltCard = document.getElementById('tiltCard');
        tiltCard.addEventListener('mousemove', (e) => {
            const rect = tiltCard.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = ((y / rect.height) - 0.5) * -8;
            const rotateY = ((x / rect.width) - 0.5) * 8;
            tiltCard.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        tiltCard.addEventListener('mouseleave', () => {
            tiltCard.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
        });
    </script>
</body>
</html>
